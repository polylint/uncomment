[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "uncomment"
version = "3.11.1"
description = "A fast Rust-based CLI tool for removing comments from source code"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Na'aman Hirschfeld", email = "nhirschfeld@gmail.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing",
    "Environment :: Console"
]
keywords = ["comments", "cli", "rust", "remove-comments", "code-cleanup", "ai-generated-code", "formatting", "uncomment"]
requires-python = ">=3.11"
# Set per wheel by hatch_build.py: the platform wheels carry the binary and need
# nothing; the py3-none-any fallback wheel downloads it and needs certifi.
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/polylint/uncomment"
Repository = "https://github.com/polylint/uncomment.git"
Issues = "https://github.com/polylint/uncomment/issues"

[project.scripts]
uncomment = "uncomment.cli:main"

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["uncomment"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# No sdist: each wheel is either a prebuilt platform binary or the download
# fallback, and a source build could reproduce neither.
[tool.hatch.build.targets.sdist]
exclude = ["*"]
